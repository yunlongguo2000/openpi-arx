# ARX Pi0.5 推理部署配置
# 用于 inference_arx.py

# Policy Server 地址 (运行 serve_policy.py 的机器)
policy_server:
  host: "192.168.110.26"  # deepcybo (RTX 4090 GPU服务器)
  port: 8000

# 机器人 RPC 服务地址 (运行 arx_ros2_rpc_server.py 的机器人电脑)
robot:
  ip: "127.0.0.1"         # 本机 (arx) ROS2 RPC 服务
  port: 4242

# 相机配置
cameras:
  left_wrist:
    width: 424
    height: 240
    fps: 15
  right_wrist:
    width: 424
    height: 240
    fps: 15

# 控制参数
control:
  action_horizon: 16       # 每次推理输出的动作步数
  control_freq: 15         # 控制频率 Hz (与数据集 FPS 一致)
  warmup_steps: 20         # 滑动窗口填满前的等待步数

# 语言指令
task_instruction: "pick up the object"
