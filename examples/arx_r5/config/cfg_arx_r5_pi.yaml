# ARX R5 Pi0.5 Full Joint Inference Config
# For the pi05_arx_r5_bottle_handoff fine-tuned model

# Run mode: local (direct model load) or remote (connect to serve_policy.py)
inference_type: "remote"  # local / remote

# Model configuration
model:
  name: "pi05_arx_r5_bottle_handoff"
  checkpoint_dir: "/vepfs-mlp2/c20250510/250404002/pi05_arx_r5/checkpoints/pi05_arx_r5_bottle_handoff/bottle_handoff_v1/3000"  # Trained checkpoint
  # norm_stats_dir: "/vepfs-mlp2/c20250510/250404002/pi05_arx_r5/datasets/arx_r5_bottle_handoff"  # Optional override

# Remote Policy Server (only if inference_type is remote)
policy_server:
  host: "192.168.110.26"
  port: 8000

# Robot Hardware
robot:
  robot_type: "arx_r5"
  ip: "127.0.0.1"
  port: 4242
  mode: "execute"         # execute / mock (dry run)
  control_mode: "full_joint"    # full_joint / delta_ee

# Image resolution
image:
  width: 424
  height: 240

# Control loop
control:
  action_horizon: 16
  action_fps: 15
  max_steps: 0            # 0 for infinite

# Head camera extrinsic calibration
calibration:
  enabled: false
  params_path: ""

# Task
task_description: "pick up the object"
