# ARX R5 Pi0.5 Full Joint Inference Config
# For the pi05_arx_r5_bottle_handoff fine-tuned model

# Run mode: local (direct model load) or remote (connect to serve_policy.py)
inference_type: "remote"  # local / remote

# Model configuration
model:
  name: "pi05_arx_r5_bottle_handoff"
  checkpoint_dir: "/home/yunlong/ARX_new/pi05_deploy/checkpoints/bottle_handoff_v2/13000"  # Trained checkpoint

# Remote Policy Server (only if inference_type is remote)
policy_server:
  host: "127.0.0.1"
  port: 8000

# Robot Hardware
robot:
  robot_type: "arx_r5"
  ip: "10.10.10.2"
  port: 4242
  mode: "execute"          # execute / mock / read_only
  control_mode: "full_joint"    # full_joint / delta_ee

# Image resolution
image:
  width: 424
  height: 240

# Control loop
control:
  action_horizon: 16
  action_fps: 15
  max_steps: 3000            # 0 for infinite

# Head camera extrinsic calibration
cameras:
  enabled: true
  head_serial: "218622271302"
  left_wrist_serial: "218622274803"
  right_wrist_serial: "218622278394"

calibration:
  enabled: false
  params_path: ""

# Task
task_description: "Hand the bottle from the left arm to the right arm and place it in the basket on the right."
