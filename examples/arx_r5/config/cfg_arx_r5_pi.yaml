# ARX R5 Pi0.5 Full Joint Inference Config
# For the pi05_arx_r5_bottle_handoff fine-tuned model

# Run mode: local (direct model load) or remote (connect to serve_policy.py)
inference_type: "remote"  # local / remote

# Model configuration
model:
  name: "pi05_arx_r5_bottle_handoff"  # ARX R5 full joint fine-tuned model (28D/56D)
  checkpoint_dir: "~/models/pi05_arx_r5_bottle_handoff"  # Only for local inference
  # norm_stats_dir: "~/models/pi05_arx_r5_bottle_handoff/assets/arx_r5_bottle_handoff" # Optional override

# Remote Policy Server (only if inference_type is remote)
policy_server:
  host: "192.168.110.26"
  port: 8000

# Robot Hardware
robot:
  robot_type: "dual_r5"   # ARX R5 is pure dual-arm (no chassis)
  ip: "127.0.0.1"
  port: 4242
  mode: "execute"         # execute / mock (dry run)
  control_space: "joint"  # Full joint control (40D -> 28D core)

# Image resolution
image:
  width: 424
  height: 240

# Control loop
control:
  action_horizon: 16
  action_fps: 15          # Hz
  max_steps: 0            # 0 for infinite

# Head camera extrinsic calibration
calibration:
  enabled: false                    # set true to enable board detection
  params_path: ""                   # auto-detect (algorithms/calibration/calibration_params.yaml)

# Task
task_description: "pick up the object"
