# ARX Pi0.5 Unified Inference Config

# Run mode: local (direct model load) or remote (connect to serve_policy.py)
inference_type: "remote"  # local / remote

# Model configuration
model:
  name: "pi05_arx"        # pi05_arx (32D) / pi05_arx_delta_ee (14D)
  checkpoint_dir: "~/models/pi05_arx_v1"  # Only for local inference
  # norm_stats_dir: "~/models/pi05_arx_v1/assets/arx" # Optional override

# Remote Policy Server (only if inference_type is remote)
policy_server:
  host: "192.168.110.26"
  port: 8000

# Robot Hardware
robot:
  ip: "127.0.0.1"
  port: 4242
  mode: "execute"         # execute / mock (dry run)
  control_space: "joint"  # joint (32D) / ee (14D) - MUST match model.name

# Image resolution
image:
  width: 424
  height: 240

# Control loop
control:
  action_horizon: 16
  action_fps: 15          # Hz
  max_steps: 0            # 0 for infinite

# Task
task_description: "pick up the object"
